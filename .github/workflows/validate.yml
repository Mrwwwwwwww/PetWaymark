name: Validate rules and scaffold
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_scaffold.py
      - run: python scripts/validate_data.py
      - run: python scripts/audit_coverage.py --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.13'
        with:
          node-version: '22'
      - name: Install browser test tooling
        if: matrix.python-version == '3.13'
        run: |
          npm --prefix "$RUNNER_TEMP/petwaymark-browser" install --no-save --no-package-lock playwright@1.64.0
          "$RUNNER_TEMP/petwaymark-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify native browser inputs, language, export and print
        if: matrix.python-version == '3.13'
        env:
          NODE_PATH: ${{ runner.temp }}/petwaymark-browser/node_modules
        run: |
          python -m apps.web.server --port 8766 &
          petwaymark_web_pid=$!
          trap 'kill "$petwaymark_web_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Local web failed to start')
          PY
          node tests/browser_smoke.cjs
      - name: Verify independent data version
        run: python scripts/package_data.py --check
      - name: Build static mobile checklist
        if: matrix.python-version == '3.13'
        run: python scripts/build_pages.py --check
      - name: Build offline pages
        if: matrix.python-version == '3.13'
        run: python scripts/build_pages.py
      - name: Verify mobile checklist and unknown branches
        if: matrix.python-version == '3.13'
        env:
          NODE_PATH: ${{ runner.temp }}/petwaymark-browser/node_modules
        run: node tests/pages_smoke.cjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.13'
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated pages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
